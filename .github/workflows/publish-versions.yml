# Publish ruff version information to the versions repository.
#
# Assumed to run as a subworkflow of .github/workflows/release.yml; specifically, as a post-announce
# job within `cargo-dist`.
name: publish-versions

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish-versions:
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Set branch name"
        run: echo "BRANCH_NAME=update-versions-$VERSION-$(date +%s)" >> "$GITHUB_ENV"

      - name: "Clone versions repo"
        env:
          # SECURITY REQUIREMENT: This must be set to a specific, reviewed commit hash from astral-sh/versions
          # to prevent arbitrary code execution. Using a branch name or 'main' is NOT secure.
          #
          # To update this value:
          # 1. Review the changes in the target commit of astral-sh/versions
          # 2. Verify the scripts (convert-cargo-dist-plan.py, insert-versions.py) are safe
          # 3. Update VERSIONS_REPO_COMMIT to the full 40-character commit SHA
          #
          # Example: VERSIONS_REPO_COMMIT: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0"
          VERSIONS_REPO_COMMIT: "" # MUST BE SET - workflow will fail if empty
        run: |
          if [ -z "$VERSIONS_REPO_COMMIT" ]; then
            echo "ERROR: VERSIONS_REPO_COMMIT must be set to a specific commit hash for security"
            echo "See comments in the workflow file for instructions"
            exit 1
          fi

          # Clone without credentials to prevent PAT from being persisted in .git/config
          git clone https://github.com/astral-sh/versions.git astral-versions
          cd astral-versions

          # Checkout the pinned, reviewed commit
          git checkout "$VERSIONS_REPO_COMMIT"

          # Verify we're at the expected commit
          actual_commit=$(git rev-parse HEAD)
          if [ "$actual_commit" != "$VERSIONS_REPO_COMMIT" ]; then
            echo "ERROR: Commit mismatch. Expected $VERSIONS_REPO_COMMIT, got $actual_commit"
            exit 1
          fi

          echo "Using versions repository at verified commit: $actual_commit"

      - name: "Install uv"
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: "Update versions"
        env:
          PLAN: ${{ inputs.plan }}
        run: printf '%s' "$PLAN" | uv run astral-versions/scripts/convert-cargo-dist-plan.py | uv run astral-versions/scripts/insert-versions.py --name ruff

      - name: "Commit versions"
        working-directory: astral-versions
        run: |
          git config user.name "astral-versions-bot"
          git config user.email "176161322+astral-versions-bot@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "Update ruff to version $VERSION"

      - name: "Create Pull Request"
        working-directory: astral-versions
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRAL_VERSIONS_PAT }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          pull_request_title="Add ruff $VERSION"

          gh pr list --state open --json title --jq ".[] | select(.title == \"$pull_request_title\") | .number" | \
            xargs -I {} gh pr close {}

          # Configure git to use the PAT only for this push operation via credential helper
          # This avoids persisting the credential in .git/config
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'
          git push https://github.com/astral-sh/versions.git "$BRANCH_NAME"

          gh pr create --base main --head "$BRANCH_NAME" \
            --title "$pull_request_title" \
            --body "Automated versions update for $VERSION" \
            --label "automation"

      - name: "Merge Pull Request"
        if: ${{ !fromJson(inputs.plan).announcement_tag_is_implicit }}
        working-directory: astral-versions
        env:
          GITHUB_TOKEN: ${{ secrets.ASTRAL_VERSIONS_PAT }}
        run: |
          # Wait for PR to be created before merging
          sleep 10
          gh pr merge --squash "$BRANCH_NAME"
